name: Validate lifecycle self-host images

on:
  push:
    branches: [codex/validate-selfhost-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-host-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SECRET_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: daa177de4b6a919cc2e6e05818311d7f4ee5bb85
          fetch-depth: 0

      - name: Record source and build environment
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^
          docker version
          docker compose version
          free -h
          df -h /

      - name: Build the documented self-host stack from a clean checkout
        run: |
          set -o pipefail
          docker compose build --pull 2>&1 | tee /tmp/selfhost-compose.log

      - name: Verify Vercel runner user switching without live credentials
        run: |
          set -o pipefail
          docker build --target vercel-runner -t facility-lifecycle-vercel:validation -f runner/Dockerfile . 2>&1 | tee /tmp/selfhost-vercel.log

      - name: Record built images
        run: docker image ls --digests

      - name: Smoke test the built Compose stack
        run: |
          set -euo pipefail
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:4400/readyz
          curl --fail http://127.0.0.1:3400/login -o /tmp/selfhost-login.html
          grep -qi 'html' /tmp/selfhost-login.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4400/v1/me)" = 401
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = 0
          docker compose restart api web
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:4400/readyz
          curl --fail http://127.0.0.1:3400/login -o /dev/null
          docker compose ps -a

      - name: Save runtime logs and stop disposable stack
        if: always()
        run: |
          docker compose logs --no-color > /tmp/selfhost-runtime.log
          docker compose down --volumes

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfhost-build-logs
          path: /tmp/selfhost-*.log
          if-no-files-found: warn
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: daa177de4b6a919cc2e6e05818311d7f4ee5bb85
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.11.3
          terraform_wrapper: false

      - run: pnpm install --frozen-lockfile

      - name: Verify the AWS control-plane module
        run: |
          terraform -chdir=infra/terraform/aws fmt -check -recursive
          terraform -chdir=infra/terraform/aws init -backend=false -input=false
          terraform -chdir=infra/terraform/aws validate
          terraform -chdir=infra/terraform/aws test -no-color

      - name: Enforce rollback-safe new migrations
        env:
          BASE_SHA: c14bc6db34862e2e3135f9f6c0cf44370a998df8
          HEAD_SHA: daa177de4b6a919cc2e6e05818311d7f4ee5bb85
        run: pnpm migrations:check "$BASE_SHA" "$HEAD_SHA"

      - name: Release-shaped verification
        run: pnpm verify

      - name: Install browser acceptance runtime
        run: pnpm --filter @facility/web exec playwright install --with-deps chromium

      - name: Verify workspace lifecycle through the web UI
        env:
          DATABASE_URL: postgres://facility:facility@127.0.0.1:5461/facility_test
        run: |
          pnpm --filter @facility/web test:e2e
          docker compose -f docker-compose.dev.yml up -d --wait postgres
          pnpm --filter @facility/web test:e2e:integration

  # Keep the compatibility floor honest without duplicating the integration
  # and deployment suites already exercised by the Node 24 acceptance jobs.
  minimum-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: daa177de4b6a919cc2e6e05818311d7f4ee5bb85
          fetch-depth: 0 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Confirm the declared minimum runtime
        run: test "$(node --version)" = "v22.13.0"

      - run: pnpm install --frozen-lockfile

      - name: Build the workspace and test non-database compatibility
        run: |
          pnpm build
          pnpm test:uncached
          pnpm --filter @theagilemonkeys/facility test
